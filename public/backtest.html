<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockLens 데이터 안내</title>
  <style>
    :root { color-scheme: dark; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b1220; color:#e5edf7; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:760px; padding:40px 24px; }
    .card { background:#111827; border:1px solid #243041; border-radius:24px; padding:32px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
    h1 { margin:0 0 16px; font-size:28px; }
    p { color:#aeb9c8; line-height:1.7; font-size:15px; }
    ul { margin:20px 0; padding-left:20px; color:#c7d2e2; line-height:1.8; }
    a { color:#58a6ff; text-decoration:none; }
    .notice { margin-top:22px; padding:16px; border-radius:14px; background:rgba(248,113,113,.08); border:1px solid rgba(248,113,113,.28); color:#f3c7c7; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>StockLens 데이터 안내</h1>
      <p>이 페이지는 과거 수익이나 거래 방식을 제시하지 않습니다. StockLens는 공시, 재무, 뉴스, 거래 데이터 등 공개 정보를 정리해 보여주는 정보 제공 서비스입니다.</p>
      <ul>
        <li>거래 실행 여부를 제공하지 않습니다.</li>
        <li>미래 가격이나 예상 수익을 제공하지 않습니다.</li>
        <li>공개 데이터의 과거 흐름만 정리합니다.</li>
        <li>이용자별 1:1 상담을 제공하지 않습니다.</li>
      </ul>
      <div class="notice">제공되는 내용은 공개 데이터 확인용 참고 자료입니다.</div>
      <p><a href="/">홈으로 돌아가기</a></p>
    </div>
  </main>
</body>
</html>
