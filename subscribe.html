<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="StockLens는 현재 무료 공개 운영 중입니다. 공개 데이터 리포트를 하루 3회까지 이용할 수 있습니다." />
  <title>StockLens — 무료 이용 안내</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #042C53;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    .card {
      width: min(680px, 100%);
      padding: 40px 32px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      background: rgba(255,255,255,0.05);
      text-align: center;
    }
    .label { color: #6DB3F8; font-size: 13px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    h1 { margin-top: 14px; font-size: clamp(28px, 5vw, 44px); line-height: 1.15; }
    p { margin-top: 16px; color: #A0B4C8; line-height: 1.8; }
    ul { margin: 28px auto 0; display: inline-grid; gap: 10px; text-align: left; color: #dce8f5; list-style: none; }
    li::before { content: "✓"; color: #00C853; font-weight: 800; margin-right: 8px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 14px 22px;
      border-radius: 999px;
      font-weight: 800;
      text-decoration: none;
    }
    .primary { background: #2196F3; color: #fff; }
    .secondary { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.12); }
    .notice { margin-top: 28px; font-size: 13px; color: #8FA4BA; }
  </style>
</head>
<body>
  <main class="card">
    <div class="label">Free Access</div>
    <h1>현재는 무료로 제공합니다</h1>
    <p>StockLens는 무료 공개 운영 중입니다. 결제 등록 없이 공개 데이터 리포트를 바로 이용할 수 있습니다.</p>
    <ul>
      <li>공개 데이터 리포트 3회/일</li>
      <li>단기·장기 데이터 탭 제공</li>
      <li>자동 결제 또는 자동 유료 전환 없음</li>
    </ul>
    <div class="actions">
      <a class="primary" href="https://apps.apple.com/kr/app/%EC%8A%A4%ED%86%A1%EB%A0%8C%EC%A6%88/id6769665646" target="_blank">App Store에서 받기</a>
      <a class="secondary" href="index.html">홈으로 이동</a>
    </div>
    <p class="notice">향후 유료 기능을 도입하는 경우, 요금과 적용 시점을 사전에 별도 고지합니다.</p>
  </main>
</body>
</html>
