<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockLens — 내 정보 안내</title>
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#042C53; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; padding:24px; }
    .card { width:min(640px,100%); padding:38px 30px; border-radius:22px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); text-align:center; }
    .label { color:#6DB3F8; font-weight:800; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; }
    h1 { margin:12px 0; font-size:32px; }
    p { color:#A0B4C8; line-height:1.75; }
    ul { display:inline-grid; gap:10px; margin:26px auto 0; text-align:left; color:#dce8f5; list-style:none; }
    li::before { content:"✓"; color:#00C853; font-weight:800; margin-right:8px; }
    .actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:30px; }
    a { display:inline-flex; align-items:center; justify-content:center; min-width:160px; padding:13px 20px; border-radius:999px; font-weight:800; text-decoration:none; }
    .primary { background:#2196F3; color:#fff; }
    .secondary { background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.12); }
  </style>
</head>
<body>
  <main class="card">
    <div class="label">Account Notice</div>
    <h1>무료 공개 운영 중입니다</h1>
    <p>현재 웹 마이페이지는 별도로 운영하지 않습니다. 계정 관련 기능은 StockLens 앱의 내 정보 화면에서 이용해 주세요.</p>
    <ul>
      <li>공지사항 확인</li>
      <li>문의 작성 및 문의 내역 확인</li>
      <li>로그아웃 및 계정 삭제 요청</li>
    </ul>
    <div class="actions">
      <a class="primary" href="https://apps.apple.com/kr/app/stocklens/id6762089015" target="_blank">App Store에서 받기</a>
      <a class="secondary" href="index.html">홈으로 이동</a>
    </div>
  </main>
</body>
</html>
